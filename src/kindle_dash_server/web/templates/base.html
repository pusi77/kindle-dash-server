<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}kindle-dash-server{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">kindle-dash-server</a>
    <nav>
      <a href="/" {% if active == 'dashboard' %}class="on"{% endif %}>Dashboard</a>
      <a href="/sources" {% if active == 'sources' %}class="on"{% endif %}>Sources</a>
      <a href="/display" {% if active == 'display' %}class="on"{% endif %}>What's shown</a>
      <a href="/settings" {% if active == 'settings' %}class="on"{% endif %}>Settings</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>v{{ version }} · device endpoint <code>{{ settings.device.path }}</code></footer>
</body>
</html>
