# Art Institute of Chicago API: public-domain prints (etchings, woodcuts, engravings…).
# API docs: https://api.artic.edu/docs/  Images: IIIF, CC0 for public-domain works.
# AIC asks API users to identify themselves with the AIC-User-Agent header; its Cloudflare
# protection also challenges requests without it.
type: json_api
name: Art Institute of Chicago — prints
description: Public-domain etchings, woodcuts, engravings and lithographs (CC0).
enabled: true
url: https://api.artic.edu/api/v1/artworks/search
headers:
  AIC-User-Agent: kindle-dash-server (+https://github.com/pusi77/kindle-dash-server)
params:
  limit: 100
  fields: id,title,artist_title,artist_display,date_display,image_id,thumbnail,medium_display
  # Elasticsearch query, sent as query[bool][must][0][term][is_public_domain]=true etc.
  # One technique per request, picked at random (Jinja's random filter).
  query:
    bool:
      must:
        - term: {is_public_domain: true}
        - exists: {field: image_id}
        - match:
            classification_titles: "{{ ['etching', 'woodcut', 'engraving', 'lithograph', 'drypoint'] | random }}"
# AIC search stops at 1,000 results (page * limit <= 1000): pages 1-10 of 100.
pages:
  param: page
  max: 10
  total_path: pagination.total_pages
items: "data[?image_id]"
pick: random
image_headers:
  AIC-User-Agent: kindle-dash-server (+https://github.com/pusi77/kindle-dash-server)
fields:
  # IIIF: 1686 px wide for public-domain works, falling back to the standard 843.
  image:
    - "https://www.artic.edu/iiif/2/{{ image_id }}/full/1686,/0/default.jpg"
    - "https://www.artic.edu/iiif/2/{{ image_id }}/full/843,/0/default.jpg"
  title: title
  author: artist_title
  width: thumbnail.width
  height: thumbnail.height
  credit: "{{ date_display }}{% if medium_display %} · {{ medium_display }}{% endif %} · Art Institute of Chicago · CC0"
  url: "https://www.artic.edu/artworks/{{ id }}"
constants:
  license: CC0
layout: art
refresh: 1h
response_ttl: 1d
weight: 2
filters:
  # Skip very wide or very tall works: they'd be tiny on a portrait screen.
  min_aspect: 0.45
  max_aspect: 1.6
  min_width: 600
