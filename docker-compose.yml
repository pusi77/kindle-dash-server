services:
  kindle-dash-server:
    image: ghcr.io/pusi77/kindle-dash-server:latest
    # To build from this checkout instead of pulling: comment out "image" and uncomment:
    # build: .
    container_name: kindle-dash-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # settings.yaml, sources/, plugins/, fonts/, cache/ and state live here
      - ./data:/data
    environment:
      TZ: Europe/Rome
      # PUID: 1000            # user/group the server runs as; ./data is given to them
      # PGID: 1000
      # KDS_BASIC_AUTH: "admin:change-me"   # optional basic auth for the web UI
      # KDS_LOG_LEVEL: DEBUG
